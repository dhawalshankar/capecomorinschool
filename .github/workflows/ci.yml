# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-DUMMYMEASUREMENTID
      NEXT_PUBLIC_EMAILJS_SERVICE_ID: service_dummy
      NEXT_PUBLIC_EMAILJS_ADMISSIONS_TEMPLATE_ID: template_dummy
      NEXT_PUBLIC_EMAILJS_CONTACT_TEMPLATE_ID: template_dummy
      NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: dummy_public_key
      NEXT_PUBLIC_DEV_ADMIN_HOST: admin.localhost:3000
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy-firebase-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy-project-id
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:dummyappid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run build
        run: npm run build

